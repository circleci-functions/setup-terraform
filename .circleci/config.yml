version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  prerelease:
    type: boolean
    default: false
    description: >-
      Publish this branch as a pre-release instead of running the full suite
      (see RELEASE.md). Set it when triggering a pipeline from the UI.

executors:
  go:
    docker:
      - image: cimg/go:1.27
  # The smoke jobs run the cross-compiled binary on executors with no Go and no
  # Terraform.
  base:
    docker:
      - image: cimg/base:stable
  base-arm64:
    docker:
      - image: cimg/base:stable
    resource_class: arm.medium
  macos:
    macos:
      xcode: "16.4.0"

commands:
  smoke:
    description: >-
      Install Terraform with the built binary for this executor, passing no
      --os or --arch, then resolve terraform by name in a later step that
      sourced nothing.
    parameters:
      platform:
        type: string
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Terraform with the built binary
          command: |
            "$PWD/dist/setup-terraform/<< parameters.platform >>/setup-terraform" --version 1.9.8
      - run:
          name: A later step resolves terraform on PATH, unaided
          command: |
            command -v terraform
            terraform version | tee /dev/stderr | grep -q "Terraform v1.9.8"
            terraform version | grep -q "on $(echo "<< parameters.platform >>" | tr / _)"

jobs:
  test:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-terraform-go-{{ checksum "go.sum" }}-
            - setup-terraform-go-
      - run: task lint
      # A release is the only thing that runs `task publish`, so a missing task
      # would otherwise surface at release time.
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-terraform-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-terraform into ./dist and persists it to the workspace, so
  # smoke-test exercises exactly what publish is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-terraform-go-{{ checksum "go.sum" }}-
            - setup-terraform-go-
      - run: task dry-run
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Compiles setup-terraform in TestMain and installs real Terraform releases over the
  # network, asserting the installed binary reports the requested version.
  acceptance:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-terraform-go-{{ checksum "go.sum" }}-
            - setup-terraform-go-
      - run:
          name: Run acceptance tests
          command: task acceptance
      - store_test_results:
          path: test-results

  # The one property the in-process acceptance suite can't prove: the shipped
  # cross-compiled artifact installs Terraform for the executor it runs on, and a
  # later step resolves terraform on PATH without anything being sourced from a
  # shell.
  smoke-test:
    executor: base
    steps:
      - smoke:
          platform: linux/amd64

  smoke-arm64:
    executor: base-arm64
    steps:
      - smoke:
          platform: linux/arm64

  smoke-macos:
    executor: macos
    steps:
      - smoke:
          platform: darwin/arm64

workflows:
  test-publish:
    when:
      not: << pipeline.parameters.prerelease >>
    jobs:
      - test
      - build
      - acceptance
      - smoke-test:
          requires: [build]
      - smoke-arm64:
          requires: [build]
      - smoke-macos:
          requires: [build]
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-terraform-go
          # One at a time, so two pushes can't race to rewrite release/next.
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - acceptance
            - smoke-test
            - smoke-arm64
            - smoke-macos
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-terraform-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main

  # Triggered by hand, so it skips the smoke test: the pre-release is what gets
  # tested. Only maintainers can publish one.
  prerelease:
    when: << pipeline.parameters.prerelease >>
    jobs:
      - test
      - build
      - toolkit/publish-prerelease:
          name: publish-prerelease
          executor: go
          cache-prefix: setup-terraform-go
          requires: [test, build]
          context: [functions-prerelease]
