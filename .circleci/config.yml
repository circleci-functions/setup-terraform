version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # smoke-test runs the cross-compiled binary on an image with no Go and no Terraform.
  base:
    docker:
      - image: cimg/base:stable

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-terraform-go-{{ checksum "go.sum" }}-
            - setup-terraform-go-
      - run: task lint
      - run: task test
      - save_cache:
          key: setup-terraform-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-terraform into ./dist and persists it to the workspace, so
  # smoke-test exercises exactly what publish is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-terraform-go-{{ checksum "go.sum" }}-
            - setup-terraform-go-
      - run: task dry-run
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Compiles setup-terraform in TestMain and installs real Terraform releases over the
  # network, asserting the installed binary reports the requested version.
  acceptance:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-terraform-go-{{ checksum "go.sum" }}-
            - setup-terraform-go-
      - run:
          name: Run acceptance tests
          command: task acceptance

  # The one property the in-process acceptance suite can't prove: the shipped
  # cross-compiled artifact installs Terraform for real, and a later step resolves
  # terraform on PATH without anything being sourced from a shell.
  smoke-test:
    executor: base
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Terraform with the built binary
          command: |
            BIN="$PWD/dist/setup-terraform/linux/amd64/setup-terraform"
            "$BIN" --version 1.9.8
            terraform version | grep -q "Terraform v1.9.8"
      - run:
          name: A later step resolves terraform on PATH, unaided
          command: |
            command -v terraform
            terraform version

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-terraform-go-{{ checksum "go.sum" }}-
            - setup-terraform-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - build:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - acceptance:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - smoke-test:
          requires: [build]
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - publish:
          requires: [test, acceptance, smoke-test]
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
